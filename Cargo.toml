[package]
name = "ssh-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Linux and macOS SSH terminal manager with HTTP CONNECT proxies"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
httparse = "1"
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tui-term = "0.3.4"
url = "2"
vt100 = "0.16.2"
zeroize = "1"
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
